const en=(new URLSearchParams(location.search).get('lang')||(/^de/i.test(navigator.language)?'de':'en'))==='en';
const T=en?{lede:'Confidential page for the team. Please enter the password.',lab:'Password',go:'Open',wait:'Checking …',err:'Wrong password.'}
          :{lede:'Vertrauliche Seite für das Team. Bitte Passwort eingeben.',lab:'Passwort',go:'Öffnen',wait:'Prüfe …',err:'Falsches Passwort.'};
const $=id=>document.getElementById(id);
if(en){document.documentElement.lang='en';$('lede').textContent=T.lede;$('lab').textContent=T.lab;$('go').textContent=T.go}
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),S=crypto.subtle,K='sehn-intern-key';
async function show(key){
  const pt=await S.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
async function derive(pw){
  const b=await S.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return S.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.iter,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt']);
}
try{const r=sessionStorage.getItem(K);if(r){await show(await S.importKey('raw',u8(r),'AES-GCM',false,['decrypt']));return}}catch(_){try{sessionStorage.removeItem(K)}catch(_){}}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();$('go').disabled=true;$('go').textContent=T.wait;$('err').textContent='';
  try{
    const key=await derive($('pw').value);
    const raw=new Uint8Array(await S.exportKey('raw',key));
    await show(key);
    try{sessionStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}
  }catch(_){$('err').textContent=T.err;$('go').disabled=false;$('go').textContent=T.go;$('pw').select()}
});
